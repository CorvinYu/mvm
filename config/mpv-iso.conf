# 隔离 mpv 配置（仅本项目使用）
# 绝不加载用户的 %APPDATA%\mpv 配置

# 完全隔离：不使用任何用户配置
no-config

# 保持窗口置顶，方便边听歌边看画面
ontop=yes

# 静音（模式 B：声音由原播放器负责）
mute=yes
volume=0

# 视频窗口标题，便于调试识别
title=MVM-Video

# 窗口大小
autofit-larger=100%x100%

# 不做画质缩放（保持轻量）
profile=fast

# 缓存（在线流需要）
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=20

# 屏蔽 mpv 自己的错误弹窗，避免打断
term-status-msg=

# 不使用硬件解码（可选，先求稳）
hwdec=no
